plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/main/java'])
            include 'com/whammich/invasion/InvasionMod.java'
            include 'com/whammich/invasion/Reference.java'
            include 'com/whammich/invasion/ConfigHandler.java'
            include 'com/whammich/invasion/util/**'
            include 'com/whammich/invasion/proxy/**'
            include 'com/whammich/invasion/registry/**'
            include 'com/whammich/invasion/item/**'
            include 'com/whammich/invasion/client/NexusScreen.java'
            include 'com/whammich/invasion/client/animation/**'
            include 'com/whammich/invasion/client/model/**'
            include 'com/whammich/invasion/client/renderer/**'
            include 'com/whammich/invasion/nexus/**'
            include 'com/whammich/invasion/wave/**'
            include 'com/whammich/invasion/entity/**'
            include 'com/whammich/invasion/command/**'
            include 'com/whammich/invasion/network/**'
        }
        resources {
            setSrcDirs(['src/main/resources', 'src/generated/resources'])
            exclude 'mcmod.info'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    // Decode b64 into source tree AND destinationDir. Writing only under src/
    // in doFirst is too late for Gradle's input snapshot, so the jar never
    // received the decoded item/block PNGs (purple/black missing textures).
    doFirst {
        def texRoot = file('src/main/resources/assets/invasion/textures')
        def destTexRoot = new File(destinationDir, 'assets/invasion/textures')
        def decodeDir = { File b64Dir, File outDir ->
            if (!b64Dir.exists()) return
            outDir.mkdirs()
            b64Dir.eachFileMatch(~/.*\.png\.b64/) { f ->
                def plain = f.name.replaceAll(/\.b64$/, '')
                def bytes = f.getText('UTF-8').decodeBase64()
                new File(outDir, plain).bytes = bytes
            }
        }
        def writeDecoded = { File b64Dir, String relOut ->
            decodeDir(b64Dir, new File(texRoot, relOut))
            decodeDir(b64Dir, new File(destTexRoot, relOut))
        }
        writeDecoded(new File(texRoot, 'block_b64'), 'block')
        writeDecoded(new File(texRoot, 'item_b64'), 'item')
        def guiB64 = new File(texRoot, 'block_b64/nexusgui.png.b64')
        if (guiB64.exists()) {
            def bytes = guiB64.getText('UTF-8').decodeBase64()
            [new File(texRoot, 'gui'), new File(destTexRoot, 'gui')].each { guiDir ->
                guiDir.mkdirs()
                new File(guiDir, 'nexus.png').bytes = bytes
            }
        }
        ['item_bundle_remaining.json', 'item_bundle_a.json', 'item_bundle_b.json'].each { bn ->
            def itemBundleRem = new File(texRoot, bn)
            if (itemBundleRem.exists()) {
                def map = new groovy.json.JsonSlurper().parse(itemBundleRem)
                [new File(texRoot, 'item'), new File(destTexRoot, 'item')].each { itemOut ->
                    itemOut.mkdirs()
                    map.each { name, b64 ->
                        new File(itemOut, name + '.png').bytes = b64.decodeBase64()
                    }
                }
            }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    inputs.dir('src/main/resources/assets/invasion/textures/item_b64').optional()
    inputs.dir('src/main/resources/assets/invasion/textures/block_b64').optional()
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java.withSourcesJar()
