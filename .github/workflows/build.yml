name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'

      - name: Fetch Waila (compile dependency)
        run: |
          mkdir -p libs
          curl -fsSL -o libs/Waila-1.5.10_1.7.10.jar \
            "https://mediafilez.forgecdn.net/files/2230/518/Waila-1.5.10_1.7.10.jar"
          ls -la libs/

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle build --stacktrace --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Invasion-mod-build
          path: |
            build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
